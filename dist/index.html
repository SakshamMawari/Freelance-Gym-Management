function loadMembers(){const saved=localStorage.getItem(STORAGE_KEY);if(saved){try{members=JSON.parse(saved)}catch{members=seedMembers()}}else{members=seedMembers();saveMembers()}}

function reminderType(member){const days=daysLeft(member.doj,member.plan);if(days<0)return 'expired';if(days===0)return 'today';if(days===1)return 'tomorrow';if(days<=7)return 'expiring';return 'active'}
function messageFor(member,type='status'){const name=member.name.split(' ')[0];const reminder=type==='status'?reminderType(member):type;const days=daysLeft(member.doj,member.plan);if(reminder==='expired')return `Hi ${name}! Your Roxy GYM membership has expired. Please renew your plan to continue your fitness journey. Contact us to renew today!`;if(reminder==='today')return `Hi ${name}! Your Roxy GYM membership expires today. Please renew your Roxy GYM plan to keep your fitness journey going without interruption.`;if(reminder==='tomorrow')return `Hi ${name}! Your Roxy GYM membership expires tomorrow. Renew today to keep your streak going and avoid any interruption.`;if(reminder==='expiring')return `Hi ${name}! Your Roxy GYM membership expires in ${days} day${days===1?'':'s'}. Renew now to keep your streak going! Contact us to avoid any interruption.`;return `Hi ${name}! Just a reminder from Roxy GYM — your ${member.plan} membership is active. Stay consistent and keep crushing those goals!`}
function phoneDigits(phone){let digits=String(phone).replace(/\D/g,'');return digits.startsWith('91')?digits:'91'+digits}
function sendReminder(member,channel='wa',type='status'){const msg=messageFor(member,type);const url=channel==='wa'?`https://wa.me/${phoneDigits(member.phone)}?text=${encodeURIComponent(msg)}`:`sms:${String(member.phone).replace(/\D/g,'')}?body=${encodeURIComponent(msg)}`;window.open(url,'_blank')}
function receiptMessage(member){return `Hi ${member.name.split(' ')[0]}! Your Roxy GYM registration is confirmed. ${member.plan} membership, ₹${member.amount} paid via ${member.payment} on ${member.doj}. Thank you for choosing Roxy GYM!`}
function sendReceipt(member,channel='wa'){const msg=receiptMessage(member);const url=channel==='wa'?`https://wa.me/${phoneDigits(member.phone)}?text=${encodeURIComponent(msg)}`:`sms:${String(member.phone).replace(/\D/g,'')}?body=${encodeURIComponent(msg)}`;window.open(url,'_blank')}
function pdfEscape(value){return String(value).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)')}
function invoicePdf(member){const lines=['ROXY GYM','MEMBERSHIP RECEIPT',`Receipt: RX-${String(member.id).slice(-6)}`,`Member: ${member.name}`,`Phone: ${member.phone}`,`Plan: ${member.plan}`,`Amount paid: INR ${member.amount}`,`Payment: ${member.payment}`,`Joined: ${member.doj}`,`Goal: ${member.goal||'General fitness'}`];let stream='BT /F1 18 Tf 50 760 Td';lines.forEach((line,index)=>{if(index)stream+=' 0 -38 Td';stream+=` (${pdfEscape(line)}) Tj`});stream+=' ET';const objects=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`];let pdf='%PDF-1.4\n';const offsets=[0];objects.forEach((object,index)=>{offsets.push(pdf.length);pdf+=`${index+1} 0 obj\n${object}\nendobj\n`});const xref=pdf.length;pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`;for(let index=1;index<offsets.length;index++)pdf+=`${String(offsets[index]).padStart(10,'0')} 00000 n \n`;pdf+=`trailer\n<< /Size ${objects.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;return new Blob([pdf],{type:'application/pdf'})}
async function shareInvoice(member){const pdf=invoicePdf(member);const file=new File([pdf],`roxy-gym-${member.name.replace(/\s+/g,'-').toLowerCase()}-invoice.pdf`,{type:'application/pdf'});if(navigator.canShare?.({files:[file]})&&navigator.share){try{await navigator.share({title:'Roxy GYM membership invoice',text:receiptMessage(member),files:[file]});return}catch(error){if(error.name==='AbortError')return}}sendReceipt(member,'wa');showToast('WhatsApp text opened. Use Print / Save PDF to attach the invoice.');}
let cameraStream=null;let cameraFacing='user';let cameraDevices=[];let cameraDeviceId=''
function closeCamera(){cameraStream?.getTracks().forEach(track=>track.stop());cameraStream=null;$('cameraSheet').classList.remove('open');if(!$('profileSheet').classList.contains('open')&&!$('invoiceSheet').classList.contains('open'))$('overlay').classList.remove('open');document.body.style.overflow=''}
function findCameraDevice(facing){const match=cameraDevices.find(device=>{const label=device.label.toLowerCase();return facing==='environment'?/back|rear|environment|traseira|trasera|arrière/.test(label):/front|user|face|facetime|frontal/.test(label)});return match||cameraDevices[0]}
async function startCamera(){if(!navigator.mediaDevices?.getUserMedia){$('photoInput').click();return false}try{const videoConstraint=cameraDeviceId?{deviceId:{exact:cameraDeviceId}}:{facingMode:{ideal:cameraFacing}};cameraStream=await navigator.mediaDevices.getUserMedia({video:videoConstraint,audio:false});$('cameraVideo').srcObject=cameraStream;cameraDevices=await navigator.mediaDevices.enumerateDevices().then(devices=>devices.filter(device=>device.kind==='videoinput'));if(!cameraDeviceId){const activeLabel=cameraStream.getVideoTracks()[0]?.label?.toLowerCase()||'';const activeDevice=cameraDevices.find(device=>device.label.toLowerCase()===activeLabel);cameraDeviceId=activeDevice?.deviceId||''}return true}catch(error){showToast('Camera unavailable. Choose a photo instead.');$('photoInput').click();return false}}
async function openCamera(){const started=await startCamera();if(started){$('overlay').classList.add('open');$('cameraSheet').classList.add('open');document.body.style.overflow='hidden'}}
async function switchCamera(){cameraFacing=cameraFacing==='user'?'environment':'user';const nextDevice=findCameraDevice(cameraFacing);cameraDeviceId=nextDevice?.deviceId||'';cameraStream?.getTracks().forEach(track=>track.stop());cameraStream=null;const started=await startCamera();if(!started){cameraFacing=cameraFacing==='user'?'environment':'user';cameraDeviceId=''}}
function captureCameraPhoto(){const video=$('cameraVideo');const canvas=$('cameraCanvas');canvas.width=video.videoWidth||640;canvas.height=video.videoHeight||480;canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);photoData=canvas.toDataURL('image/jpeg',.82);$('photoPreview').src=photoData;$('photoPreview').classList.remove('hidden');$('photoPlaceholder').classList.add('hidden');closeCamera();showToast('Photo captured')}
function renderDashboard(){const counts={total:members.length,expiring:members.filter(x=>statusFor(x)==='expiring').length,expired:members.filter(x=>statusFor(x)==='expired').length};$('totalCount').textContent=counts.total;$('expiringCount').textContent=counts.expiring;$('expiredCount').textContent=counts.expired;const query=$('searchInput').value.trim().toLowerCase();const visible=members.filter(m=>(currentFilter==='all'||statusFor(m)===currentFilter)&&(!query||m.name.toLowerCase().includes(query)||m.phone.includes(query)));$('memberList').innerHTML=visible.length?visible.map(member=>{const status=statusFor(member);return `<article class="member-card" data-id="${member.id}"><div class="member-main">${avatar(member)}<div class="member-copy"><div class="member-name">${esc(member.name)}</div><div class="member-meta">${esc(member.plan)} · ₹${esc(member.amount)}</div><div class="member-phone">${esc(member.phone)}</div></div><span class="badge ${status}"><i></i>${statusLabel(member)}</span></div><div class="member-actions"><button class="outline-btn whatsapp" data-action="wa" data-id="${member.id}">${icon('wa')} WhatsApp</button><button class="outline-btn sms" data-action="sms" data-id="${member.id}">${icon('sms')} SMS</button></div></article>`}).join(''):'<div class="empty"><strong>No members found</strong>Try a different search or add a new member.</div>'}
